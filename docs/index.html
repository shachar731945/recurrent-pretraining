<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Interactive Huginn recurrent-depth architecture diagram.">
  <title>Inside Huginn</title>
  <style>
    :root{--paper:#fffefb;--ink:#121513;--muted:#707871;--line:#d9dfd9;--mint:#e7f3ef;--peach:#ffefe2;--blue:#ecf4fb;--lemon:#fbf7d9;--focus:#166a5a}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--focus);outline-offset:5px}
    .skip{position:fixed;z-index:4;top:8px;left:8px;padding:8px 12px;color:#fff;background:var(--ink);border-radius:5px;transform:translateY(-160%)}.skip:focus{transform:none}
    header{height:82px;display:grid;place-items:center}h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.02em}
    main{width:min(calc(100% - 30px),1720px);margin:auto}.shell{position:relative;min-height:min(72vw,680px);overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    #stage{position:absolute;inset:0;display:grid;place-items:center;padding:22px 0}#stage.in{animation:in .46s cubic-bezier(.16,1,.3,1) both}#stage.out{animation:out .15s ease both}svg{width:100%;height:auto;max-height:650px;overflow:visible}
    .line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:2}.faint{stroke:#9aa49d}.dash{stroke-dasharray:7 8}.shape{fill:var(--paper);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}.mint{fill:var(--mint)}.peach{fill:var(--peach)}.blue{fill:var(--blue)}.lemon{fill:var(--lemon)}
    .label{fill:var(--ink);font-size:19px;font-weight:580;letter-spacing:-.02em}.small{font-size:16px;font-weight:530}.tiny{font-size:14px;font-weight:540;letter-spacing:.01em;fill:var(--muted)}.center{text-anchor:middle}.math{font-family:Georgia,serif;font-size:25px;font-style:italic}
    .hit{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .22s ease}.hit:hover{transform:translateY(-5px)}.hit:hover .shape{stroke-width:4}.hit:hover .hint{opacity:1}.hit:focus-visible .shape{stroke:var(--focus);stroke-width:4}.hint{opacity:0;fill:var(--focus);font-size:11px;font-weight:650;transition:opacity .18s ease}
    #back{position:absolute;z-index:2;top:14px;left:12px;width:43px;height:43px;border:0;border-radius:50%;color:var(--ink);background:transparent;font-size:27px;line-height:1;cursor:pointer;opacity:0;pointer-events:none;transition:.2s}#back.show{opacity:1;pointer-events:auto}#back:hover{background:var(--mint);transform:translateX(-2px)}
    #note{position:absolute;right:14px;bottom:10px;margin:0;color:var(--muted);font-size:11px;opacity:0;transition:.2s}#note.show{opacity:1}footer{height:78px;display:grid;place-items:center;color:var(--muted);font-size:11px;letter-spacing:.02em}footer p{margin:0}.sr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0}
    @keyframes in{from{opacity:0;transform:scale(.945)}to{opacity:1;transform:none}}@keyframes out{to{opacity:0;transform:scale(1.025)}}
    @media(max-width:720px){header{height:64px}h1{font-size:15px}main{width:calc(100% - 14px)}.shell{min-height:470px}#stage{display:block;overflow-x:auto;overflow-y:hidden;padding:42px 0 16px}#stage svg{width:1100px;max-width:none}#back{top:4px;left:3px}#note{right:7px;bottom:5px;font-size:9px}footer{height:61px;font-size:10px;text-align:center}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <a class="skip" href="#diagram">Skip to diagram</a>
  <header><h1>Inside Huginn</h1></header>
  <main><section class="shell" id="diagram" aria-label="Interactive Huginn architecture diagram">
    <button id="back" type="button" aria-label="Zoom out">←</button><div id="stage"></div><p id="note" aria-live="polite"></p><p class="sr" id="summary" aria-live="polite"></p>
  </section></main>
  <footer><p>Huginn recurrent-depth architecture · interactive concept diagram</p></footer>
  <script>
  (()=>{"use strict";
    const stage=document.querySelector("#stage"),back=document.querySelector("#back"),note=document.querySelector("#note"),summary=document.querySelector("#summary"),reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;
    let view="overview",origin=null;
    const defs=`<defs><marker id="a" viewBox="0 0 11 11" refX="9" refY="5.5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5.5 1 10" class="line"/></marker></defs>`;
    const hit=(target,label,body)=>`<g class="hit" role="button" tabindex="0" data-go="${target}" aria-label="Open ${label}">${body}</g>`;
    const arrow=(d,extra="")=>`<path class="line ${extra}" d="${d}" marker-end="url(#a)"/>`;
    function overview(){return `<svg viewBox="0 0 1680 620" role="img" aria-label="Tokenization flows into prelude, recurrent block, coda, and output.">${defs}
      ${arrow("M316 279L455 279")}${arrow("M648 279L768 279")}${arrow("M1150 279L1237 279")}${arrow("M1430 279L1514 279")}
      ${hit("tokens","tokenization",`<path class="shape mint" d="M48 145Q48 130 64 130L301 130Q316 130 316 145L316 355Q316 370 301 370L64 370Q48 370 48 355Z"/><text x="78" y="190" class="label">Tokenization</text><text x="78" y="220" class="label small">tokens → vectors</text><text x="78" y="342" class="hint">zoom in</text>`)}
      ${hit("prelude","prelude",`<path class="shape blue" d="M455 164Q455 149 470 149L633 149Q648 149 648 164L648 350Q648 365 633 365L470 365Q455 365 455 350Z"/><text x="486" y="205" class="label">Prelude</text><text x="486" y="235" class="label small">2 blocks</text><text x="486" y="338" class="hint">zoom in</text>`)}
      ${hit("recurrent","recurrent block",`<path class="shape peach" d="M768 140Q768 126 783 126L1135 126Q1150 126 1150 140L1150 366Q1150 380 1135 380L783 380Q768 380 768 366Z"/><text x="801" y="188" class="label">Recurrent block</text><text x="801" y="218" class="label small">4 shared transformer blocks</text><text x="801" y="351" class="hint">zoom in</text><path class="shape blue" d="M630 404Q630 392 643 392L747 392Q760 392 760 404L760 454Q760 466 747 466L643 466Q630 466 630 454Z"/><text x="695" y="423" class="label small center">x₀</text><text x="695" y="446" class="tiny center">random noise</text><path class="line" d="M760 420C780 405 790 393 805 380" marker-end="url(#a)"/><path class="line" d="M1060 381C1134 405 1147 449 1089 472C1017 500 861 498 800 458C769 438 777 408 805 380" marker-end="url(#a)"/><text x="949" y="510" class="tiny center">later passes: reuse the same weights</text>`)}
      ${hit("coda","coda",`<path class="shape lemon" d="M1237 164Q1237 149 1252 149L1415 149Q1430 149 1430 164L1430 350Q1430 365 1415 365L1252 365Q1237 365 1237 350Z"/><text x="1268" y="205" class="label">Coda</text><text x="1268" y="235" class="label small">2 blocks</text><text x="1268" y="338" class="hint">zoom in</text>`)}
      ${hit("output","output",`<path class="shape mint" d="M1514 222Q1514 208 1529 208L1650 208Q1664 208 1664 222L1664 354Q1664 368 1650 368L1529 368Q1514 368 1514 354Z"/><text x="1535" y="286" class="label">Output</text><text x="1534" y="315" class="tiny">next token</text>`)}
    </svg>`}
    function recurrent(){let blocks=[0,1,2,3].map(n=>{let x=572+n*236;let block=hit("transformer",`shared transformer block ${n+1}`,`<path class="shape lemon" d="M${x} 260Q${x} 250 ${x+12} 250L${x+122} 250Q${x+134} 250 ${x+134} 260L${x+134} 380Q${x+134} 390 ${x+122} 390L${x+12} 390Q${x} 390 ${x} 380Z"/><text x="${x+67}" y="313" class="label small center">Transformer</text><text x="${x+67}" y="340" class="tiny center">shared block ${n+1}</text><text x="${x+67}" y="367" class="hint center">open</text>`);return `${block}${n<3?arrow(`M${x+137} 323L${x+220} 323`):""}`}).join("");return `<svg viewBox="0 0 1680 620" role="img" aria-label="Recurrent block with fixed prelude representation e, state x, linear merge, four shared transformer blocks, and recurrence loop.">${defs}
      <text x="49" y="75" class="label">Recurrent block</text><path class="shape peach" d="M31 96Q31 84 45 84L1605 84Q1619 84 1619 98L1619 400Q1619 414 1605 414L45 414Q31 414 31 400Z"/>
      <path class="shape mint" d="M240 140Q240 128 253 128L397 128Q410 128 410 140L410 224Q410 236 397 236L253 236Q240 236 240 224Z"/><text x="325" y="174" class="label math center">e</text><text x="325" y="206" class="tiny center">from prelude</text>${arrow("M410 182C450 182 465 202 420 254")}
      <path class="shape blue" d="M310 265Q310 254 322 254L472 254Q484 254 484 265L484 381Q484 392 472 392L322 392Q310 392 310 381Z"/><text x="397" y="309" class="label center">Linear merge</text><text x="397" y="338" class="label small center">[x<tspan baseline-shift="sub" font-size="11">t</tspan> ; e] → 2d → d</text><text x="397" y="366" class="tiny center">fixed e + evolving x</text><text x="250" y="318" class="tiny center">state input</text><path class="line" d="M275 345C286 325 298 323 306 323L318 323" marker-end="url(#a)"/>${arrow("M484 323L568 323")}${blocks}
      ${arrow("M1417 323L1590 323")}<text x="1505" y="292" class="label math center">x<tspan baseline-shift="sub" font-size="15">t+1</tspan></text><text x="1505" y="310" class="tiny center">updated state</text>
      <path class="shape blue" d="M55 456Q55 444 68 444L225 444Q238 444 238 456L238 520Q238 532 225 532L68 532Q55 532 55 520Z"/><text x="147" y="482" class="label math center">x<tspan baseline-shift="sub" font-size="13">0</tspan></text><text x="147" y="511" class="tiny center">random noise · first pass</text><path class="line" d="M238 470C264 435 254 390 270 358C273 352 274 348 275 345"/>
      <path class="line" d="M1505 323C1505 540 1350 560 1180 548C880 525 600 550 390 542C310 538 275 500 275 445C275 390 274 360 275 345"/><text x="900" y="579" class="tiny center">later passes: the previous state returns to the same state input</text>
    </svg>`}
    function transformer(){let step=(x,w,name,sub,kind="")=>`<path class="shape ${kind}" d="M${x} 278Q${x} 270 ${x+10} 270L${x+w-10} 270Q${x+w} 270 ${x+w} 278L${x+w} 365Q${x+w} 373 ${x+w-10} 373L${x+10} 373Q${x} 373 ${x} 365Z"/><text x="${x+w/2}" y="324" class="label small center">${name}</text><text x="${x+w/2}" y="346" class="tiny center">${sub}</text>`;return `<svg viewBox="0 0 1680 620" role="img" aria-label="Transformer block: normalization, causal attention, residual connection, normalization, gated MLP, and residual connection.">${defs}
      <text x="49" y="75" class="label">Shared transformer block</text><path class="shape lemon" d="M31 98Q31 84 46 84L1615 84Q1630 84 1630 99L1630 483Q1630 498 1615 498L46 498Q31 498 31 483Z"/>
      ${arrow("M78 326L173 326")}<text x="78" y="302" class="label small">input</text>${step(189,112,"RMSNorm","normalize","blue")}${arrow("M304 322L363 322")}${step(380,180,"Causal attention","standard attention","mint")}${arrow("M563 322L617 322")}${step(637,110,"+","residual","peach")}${arrow("M750 322L805 322")}${step(823,113,"RMSNorm","normalize","blue")}${arrow("M939 322L994 322")}${step(1013,184,"Gated MLP","SiLU gate","mint")}${arrow("M1200 322L1257 322")}${step(1278,110,"+","residual","peach")}${arrow("M1391 322L1510 322")}<text x="1443" y="302" class="label small">output</text>
      <path class="line dash faint" d="M98 258C260 180 502 183 642 274"/><text x="364" y="196" class="tiny center">residual path</text><path class="line dash faint" d="M771 270C924 183 1155 188 1285 273"/><text x="1046" y="196" class="tiny center">residual path</text>
    </svg>`}
    function stack(name,input,out){return `<svg viewBox="0 0 1680 620" role="img" aria-label="${name} with two transformer blocks.">${defs}<text x="49" y="75" class="label">${name}</text><path class="shape blue" d="M31 102Q31 88 46 88L1622 88Q1637 88 1637 103L1637 482Q1637 496 1622 496L46 496Q31 496 31 482Z"/><text x="145" y="315" class="label small center">${input}</text>${arrow("M196 323L402 323")}${hit("transformer","first transformer block",`<path class="shape lemon" d="M420 242Q420 232 432 232L676 232Q688 232 688 242L688 402Q688 412 676 412L432 412Q420 412 420 402Z"/><text x="554" y="306" class="label center">Transformer block 1</text><text x="554" y="345" class="hint center">open</text>`)}${arrow("M690 323L820 323")}${hit("transformer","second transformer block",`<path class="shape lemon" d="M838 242Q838 232 850 232L1096 232Q1108 232 1108 242L1108 402Q1108 412 1096 412L850 412Q838 412 838 402Z"/><text x="972" y="306" class="label center">Transformer block 2</text><text x="972" y="345" class="hint center">open</text>`)}${arrow("M1108 323L1410 323")}<text x="1465" y="315" class="label small center">${out}</text></svg>`}
    function tokens(){return `<svg viewBox="0 0 1680 620" role="img" aria-label="The word recurrent is tokenized into illustrative subword pieces and embedded into vectors of width 5280.">${defs}<text x="49" y="75" class="label">Tokenization</text><path class="shape mint" d="M31 102Q31 88 46 88L1624 88Q1640 88 1640 104L1640 482Q1640 496 1624 496L46 496Q31 496 31 482Z"/><text x="180" y="232" class="label small center">input word</text><path class="shape" d="M76 270Q76 262 85 262L285 262Q294 262 294 270L294 332Q294 340 285 340L85 340Q76 340 76 332Z"/><text x="185" y="310" class="label small center">recurrent</text>${arrow("M326 301L545 301")}<text x="435" y="270" class="tiny center">tokenize</text><path class="shape blue" d="M588 262Q588 254 597 254L712 254Q721 254 721 262L721 340Q721 348 712 348L597 348Q588 348 588 340Z"/><text x="655" y="307" class="label small center">re</text><path class="shape blue" d="M747 262Q747 254 756 254L896 254Q905 254 905 262L905 340Q905 348 896 348L756 348Q747 348 747 340Z"/><text x="826" y="307" class="label small center">current</text><text x="746" y="384" class="tiny">illustrative subword pieces · token IDs 0–65,535</text>${arrow("M930 301L1138 301")}<text x="1035" y="270" class="tiny center">embed</text><path class="shape peach" d="M1170 215Q1170 202 1185 202L1510 202Q1525 202 1525 215L1525 390Q1525 403 1510 403L1185 403Q1170 403 1170 390Z"/><text x="1348" y="249" class="label small center">embedding sequence</text>${Array.from({length:8},(_,i)=>`<circle cx="${1245+(i%4)*65}" cy="${292+Math.floor(i/4)*42}" r="9" fill="#121513" opacity="${.25+i*.08}"/>`).join("")}<text x="1348" y="370" class="tiny center">shape [T, 5,280] · hidden width d = 5,280</text></svg>`}
    function output(){return `<svg viewBox="0 0 1680 620" role="img" aria-label="Output projection maps a hidden state of width 5280 through a linear language-model head to 65536 logits.">${defs}<text x="49" y="75" class="label">Output</text><path class="shape mint" d="M31 102Q31 88 46 88L1624 88Q1640 88 1640 104L1640 482Q1640 496 1624 496L46 496Q31 496 31 482Z"/><text x="190" y="294" class="label small center">final hidden state</text><text x="190" y="322" class="tiny center">shape [T, 5,280]</text>${arrow("M286 323L488 323")}<path class="shape blue" d="M510 255Q510 244 522 244L690 244Q702 244 702 255L702 391Q702 402 690 402L522 402Q510 402 510 391Z"/><text x="606" y="318" class="label center">RMSNorm</text>${arrow("M704 323L874 323")}<path class="shape peach" d="M898 235Q898 223 911 223L1153 223Q1166 223 1166 235L1166 411Q1166 423 1153 423L911 423Q898 423 898 411Z"/><text x="1032" y="298" class="label center">LM head</text><text x="1032" y="329" class="label small center">linear projection</text><text x="1032" y="358" class="tiny center">5,280 → 65,536</text>${arrow("M1168 323L1368 323")}<text x="1490" y="294" class="label small center">next-token logits</text><text x="1490" y="322" class="tiny center">shape [T, 65,536]</text></svg>`}
    const pages={overview,recurrent,transformer,prelude:()=>stack("Prelude","embeddings","stable e"),coda:()=>stack("Coda","refined state","output state"),tokens,output};
    const summaries={overview:"The full Huginn model: tokenization, prelude, recurrent block, coda, and output.",recurrent:"Fixed prelude representation e and current state x merge through a linear adapter and four shared transformer blocks before the next state loops back.",transformer:"The shared transformer block contains normalization, causal attention, residual paths, and a gated MLP.",prelude:"The prelude has two transformer blocks.",coda:"The coda has two transformer blocks.",tokens:"Text is tokenized and embedded as vectors.",output:"Final normalization and the language-model head produce next-token logits."};
    function render(animate=true){stage.className="";stage.innerHTML=pages[view]();if(animate&&!reduced){void stage.offsetWidth;stage.classList.add("in")}back.classList.toggle("show",view!=="overview");note.classList.toggle("show",view!=="overview");note.textContent=view==="recurrent"?"e stays fixed · x_t evolves · x_0 is random_noise":view==="transformer"?"shared everywhere":"";summary.textContent=summaries[view]}
    function open(next,save=true){origin=view;const go=()=>{view=next;render(true)};if(reduced)go();else{stage.classList.add("out");setTimeout(go,150)}if(save)history.pushState({view:next,origin},"","#"+next)}
    function out(save=true){const next=view==="transformer"?(origin||"recurrent"):"overview";const go=()=>{view=next;origin=next==="overview"?null:origin;render(true)};if(reduced)go();else{stage.classList.add("out");setTimeout(go,150)}if(save)history.pushState({view:next,origin},"",next==="overview"?"#diagram":"#"+next)}
    stage.addEventListener("click",e=>{const el=e.target.closest("[data-go]");if(el)open(el.dataset.go)});stage.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const el=e.target.closest("[data-go]");if(el){e.preventDefault();open(el.dataset.go)}});back.addEventListener("click",()=>out());
    addEventListener("popstate",e=>{view=e.state&&e.state.view||"overview";origin=e.state&&e.state.origin||null;render(false)});history.replaceState({view:"overview",origin:null},"","#diagram");render(false);
  })();
  </script>
</body>
</html>
